<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeOS | PDFs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      font-family: "Space Grotesk", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(250, 204, 21, 0.18), transparent 26%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.16), transparent 28%),
        linear-gradient(160deg, #020617 0%, #0f172a 50%, #111827 100%);
    }

    [data-variant="error"] {
      color: #fecaca;
      border-color: rgba(248, 113, 113, 0.35);
      background: rgba(127, 29, 29, 0.35);
    }

    [data-variant="success"] {
      color: #bbf7d0;
      border-color: rgba(74, 222, 128, 0.35);
      background: rgba(20, 83, 45, 0.35);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100">
  <main class="mx-auto min-h-screen max-w-7xl px-6 py-8 lg:px-10">
    <header class="flex flex-col gap-4 border-b border-white/10 pb-6 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="text-xs uppercase tracking-[0.4em] text-amber-300/80">LifeOS</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight text-white">PDF Library</h1>
      </div>
      <div class="flex flex-wrap gap-3">
        <a href="./dashboard.html" class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-200 transition hover:bg-white/10">Back to dashboard</a>
        <a href="./home.html" class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-200 transition hover:bg-white/10">Home</a>
      </div>
    </header>

    <section class="mt-8 grid gap-6 lg:grid-cols-[0.9fr_1.1fr]">
      <div class="rounded-[2rem] border border-white/10 bg-white/5 p-8 shadow-2xl shadow-black/30 backdrop-blur-xl">
        <p class="text-sm uppercase tracking-[0.3em] text-slate-400">Upload</p>
        <h2 class="mt-4 text-3xl font-bold tracking-tight text-white">Add a PDF</h2>
        <p class="mt-4 text-slate-300">Upload a PDF to store it and process it for your account. Only PDF files up to 10 MB are accepted.</p>

        <form id="upload-form" class="mt-8 space-y-4">
          <label class="block rounded-[1.75rem] border border-dashed border-white/15 bg-slate-950/50 p-6 transition hover:border-amber-300/35 hover:bg-slate-950/70">
            <span class="mb-2 block text-sm text-slate-300">Choose PDF</span>
            <input id="pdf-file" name="file" type="file" accept="application/pdf" required class="block w-full text-sm text-slate-300 file:mr-4 file:rounded-full file:border-0 file:bg-amber-300 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-slate-950 hover:file:bg-amber-200">
          </label>

          <button type="submit" class="w-full rounded-2xl bg-amber-300 px-5 py-3 font-semibold text-slate-950 transition hover:bg-amber-200">Upload PDF</button>
        </form>

        <div id="files-banner" class="mt-6 hidden rounded-2xl border px-4 py-3 text-sm"></div>
      </div>

      <div class="rounded-[2rem] border border-white/10 bg-slate-950/50 p-8 shadow-2xl shadow-black/30 backdrop-blur-xl">
        <div class="flex items-center justify-between gap-4">
          <div>
            <p class="text-sm uppercase tracking-[0.3em] text-slate-400">Your files</p>
            <h2 class="mt-3 text-3xl font-bold tracking-tight text-white">Uploaded PDFs</h2>
          </div>
          <button id="refresh-files" class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-200 transition hover:bg-white/10">Refresh</button>
        </div>

        <div id="files-status" class="mt-6 rounded-2xl border border-white/10 bg-slate-950/60 px-4 py-3 text-sm text-slate-200">Loading files...</div>

        <div id="files-list" class="mt-6 space-y-4"></div>
      </div>
    </section>
  </main>

  <script type="module" src="./assets/js/files.js"></script>
</body>
</html>
