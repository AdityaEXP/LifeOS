<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeOS | Subjects</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      font-family: "Space Grotesk", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(250, 204, 21, 0.18), transparent 26%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.14), transparent 28%),
        linear-gradient(160deg, #020617 0%, #0f172a 50%, #111827 100%);
    }

    [data-variant="error"] {
      color: #fecaca;
      border-color: rgba(248, 113, 113, 0.35);
      background: rgba(127, 29, 29, 0.35);
    }

    [data-variant="success"] {
      color: #bbf7d0;
      border-color: rgba(74, 222, 128, 0.35);
      background: rgba(20, 83, 45, 0.35);
    }

    [data-variant="neutral"] {
      color: #e2e8f0;
      border-color: rgba(148, 163, 184, 0.2);
      background: rgba(2, 6, 23, 0.55);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100">
  <main class="mx-auto min-h-screen max-w-7xl px-6 py-8 lg:px-10">
    <header class="flex flex-col gap-4 border-b border-white/10 pb-6 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="text-xs uppercase tracking-[0.4em] text-amber-300/80">LifeOS</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight text-white">Subjects</h1>
      </div>
      <div class="flex flex-wrap gap-3">
        <a href="./dashboard.html" class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-200 transition hover:bg-white/10">Dashboard</a>
        <a href="./files.html" class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-200 transition hover:bg-white/10">PDF library</a>
        <a href="./chatbot.html" class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-200 transition hover:bg-white/10">Chatbot</a>
      </div>
    </header>

    <section class="mt-8 grid gap-6 lg:grid-cols-[0.95fr_1.05fr]">
      <div class="space-y-6">
        <section class="rounded-[2rem] border border-white/10 bg-white/5 p-8 shadow-2xl shadow-black/30 backdrop-blur-xl">
          <p class="text-sm uppercase tracking-[0.3em] text-slate-400">Create</p>
          <h2 class="mt-4 text-3xl font-bold tracking-tight text-white">Add a subject</h2>
          <p class="mt-4 text-slate-300">Create a subject to organize your uploaded PDFs.</p>

          <form id="subject-form" class="mt-8 space-y-4">
            <label class="block">
              <span class="mb-2 block text-sm text-slate-300">Subject name</span>
              <input id="subject-name" type="text" maxlength="120" required placeholder="Example: Machine Learning" class="w-full rounded-2xl border border-white/10 bg-slate-950/60 px-4 py-3 text-slate-100 placeholder:text-slate-500 focus:border-amber-300/40 focus:outline-none focus:ring-0">
            </label>

            <button type="submit" class="w-full rounded-2xl bg-amber-300 px-5 py-3 font-semibold text-slate-950 transition hover:bg-amber-200">Create subject</button>
          </form>
        </section>

        <section class="rounded-[2rem] border border-white/10 bg-slate-950/50 p-8 shadow-2xl shadow-black/30 backdrop-blur-xl">
          <p class="text-sm uppercase tracking-[0.3em] text-slate-400">Assign</p>
          <h2 class="mt-4 text-3xl font-bold tracking-tight text-white">Attach a PDF</h2>
          <p class="mt-4 text-slate-300">Choose a subject and a previously uploaded PDF, then assign them together.</p>

          <form id="assign-form" class="mt-8 space-y-4">
            <label class="block">
              <span class="mb-2 block text-sm text-slate-300">Subject</span>
              <select id="subject-select" required class="w-full rounded-2xl border border-white/10 bg-slate-950/60 px-4 py-3 text-slate-100 focus:border-amber-300/40 focus:outline-none focus:ring-0"></select>
            </label>

            <label class="block">
              <span class="mb-2 block text-sm text-slate-300">PDF</span>
              <select id="file-select" required class="w-full rounded-2xl border border-white/10 bg-slate-950/60 px-4 py-3 text-slate-100 focus:border-amber-300/40 focus:outline-none focus:ring-0"></select>
            </label>

            <button type="submit" class="w-full rounded-2xl bg-sky-300 px-5 py-3 font-semibold text-slate-950 transition hover:bg-sky-200">Assign PDF to subject</button>
          </form>
        </section>

        <div id="subjects-banner" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
      </div>

      <section class="rounded-[2rem] border border-white/10 bg-slate-950/50 p-8 shadow-2xl shadow-black/30 backdrop-blur-xl">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
          <div>
            <p class="text-sm uppercase tracking-[0.3em] text-slate-400">Library</p>
            <h2 class="mt-3 text-3xl font-bold tracking-tight text-white">Your subjects</h2>
          </div>
          <button id="refresh-subjects" class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-200 transition hover:bg-white/10">Refresh</button>
        </div>

        <div id="subjects-status" class="mt-6 rounded-2xl border border-white/10 bg-slate-950/60 px-4 py-3 text-sm text-slate-200">Loading subjects...</div>

        <div id="subjects-list" class="mt-6 space-y-4"></div>
      </section>
    </section>
  </main>

  <script type="module" src="./assets/js/subjects.js"></script>
</body>
</html>
